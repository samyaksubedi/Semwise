# Local development services only. Production runs these as Coolify services (see infra/coolify.md).
# Start: pnpm db:up   Stop: pnpm db:down   (data survives in the named volumes)
name: semwise

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: semwise
      POSTGRES_PASSWORD: semwise
      POSTGRES_DB: semwise
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semwise -d semwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Same settings as production: AOF persistence, no eviction (queued jobs must never be dropped),
  # and a password.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "semwise",
      ]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "semwise", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.16.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email; open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3-compatible stand-in for Cloudflare R2 (SeaweedFS; MinIO no longer publishes public images).
  # Endpoint http://localhost:9000, key semwise / semwise-secret. The API creates the bucket in
  # development and tests.
  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "9000:9000"
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  s3data:
